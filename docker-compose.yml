# Ignisia — Local Development
# Usage: docker compose up --build
# App runs on http://localhost:3000

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
